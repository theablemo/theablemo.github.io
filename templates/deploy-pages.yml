# Inactive template: copy to .github/workflows/deploy.yml after choosing GitHub Pages.
# Supports a username.github.io repository or a custom domain at its root.
name: Validate and deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm
          build-cmd: npm run validate
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated build
        id: deployment
        uses: actions/deploy-pages@v5

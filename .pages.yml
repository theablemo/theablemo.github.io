media:
  input: public/assets/uploads
  output: /assets/uploads
components:
  gallery-image:
    type: object
    fields:
      - name: src
        label: Image
        type: image
        required: true
      - name: alt
        label: Image description
        type: string
        required: true
      - name: caption
        label: Caption or credit
        type: text
      - name: width
        label: Original width (pixels)
        type: number
        options:
          min: 1
      - name: height
        label: Original height (pixels)
        type: number
        options:
          min: 1
  resource:
    type: object
    fields:
      - name: label
        type: string
        required: true
      - name: url
        type: string
        required: true
      - name: icon
        type: select
        options:
          values:
            - external
            - arrow
            - file
            - github
            - play
            - database
            - mail
            - linkedin
            - scholar
  credential:
    type: object
    fields:
      - name: label
        type: string
        required: true
      - name: detail
        type: string
        required: true
      - name: url
        type: string
        required: true
      - name: icon
        type: select
        options:
          values:
            - briefcase
            - degree
            - code
  avatar-scene:
    type: object
    fields:
      - name: recipe
        label: Path recipe
        type: select
        required: true
        options:
          values:
            - timeline
            - header
            - perch
            - finish
      - name: descent
        label: Descent to next section
        type: select
        required: true
        options:
          values:
            - abseil
            - elevator
            - crawl
            - crawl-front
            - slide
            - parachute
      - name: gesture
        label: Resting gesture
        type: select
        required: true
        options:
          values:
            - idle
            - curious
            - wave
